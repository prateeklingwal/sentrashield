services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentrashield
      POSTGRES_USER: sentrashield
      POSTGRES_PASSWORD: sentrashield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrashield"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: sentrashield
      POSTGRES_USER: sentrashield
      POSTGRES_PASSWORD: sentrashield
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
